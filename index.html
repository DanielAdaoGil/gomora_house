"Matipa começa a seduzir Jonasi e a entrar cada vez mais no império dos Gomora, enquanto a imagem perfeita de Joyce e sua família começa a desmoronar.",
"Joyce organiza uma luxuosa festa de aniversário de casamento para tentar salvar sua imagem pública, obrigando a família destruída a sorrir enquanto esconde a traição que está acontecendo por trás das aparências.",
"Jonasi retorna para casa, deixando os filhos confusos. Matipa tenta reconquistá-lo, enquanto Joyce fica dividida entre preservar a paz da família e proteger a si mesma.",
"Matipa esperava receber uma compensação generosa, mas seus planos não saem como esperado. Ela então deixa J&J em busca de oportunidades mais lucrativas e de maior poder.",
"A possibilidade de uma gravidez deixa Joyce extremamente nervosa. Durante um almoço familiar, algumas conversas levantam novas suspeitas sobre os segredos escondidos dentro da família.",
"O nascimento dos gémeos provoca uma forte crise emocional em Joyce. Jonasi tenta justificar suas atitudes, mas Mpumi e Menzi chegam ao limite e deixam claro que já não aceitam seus jogos violentos.",
"Com um grande escândalo prestes a explodir, Joyce faz uma proposta desesperada e surpreendente, transformando sua dor conjugal em uma estratégia para recuperar poder.",
"Joyce continua fingindo felicidade diante das câmeras, mas a nova estrutura matrimonial provoca uma forte reação social e empurra os membros da família Gomora para um isolamento cada vez maior.",
"Um antigo amor de Jonasi finalmente aparece, revelando décadas de sacrifícios, segredos e mentiras que ele trabalhou durante anos para esconder.",
"No aniversário de Jonasi, ele espera receber carinho e atenção das mulheres de sua vida, mas encontra ressentimento e frustração. A família está cada vez mais dividida e ele começa a sentir o peso da própria solidão.",
"O batizado dos gémeos transforma-se em caos quando antigos ressentimentos e sentimentos de abandono vêm à tona, expondo ainda mais os segredos e conflitos da família Gomora.",
"Essie procura Joyce e pede que ela tente enxergar a situação também pelo seu ponto de vista. Cansada de viver cercada de segredos, Joyce começa a considerar abandonar a vida pública e enfrentar Jonasi.",
"Jonasi continua repetindo seu comportamento e começa a perseguir outra mulher, atraindo-a com promessas de poder, riqueza e luxo. Ao mesmo tempo, Xolani confronta Lindani publicamente, aumentando os conflitos familiares.",
"Lindani chega a uma situação desesperadora e precisa pedir ajuda a Mpume e Joyce. Enquanto isso, as novas traições de Jonasi continuam causando danos à família.",
"A casa dos Gomora mergulha no caos e a mãe de Lindani intervém para assumir o controle da situação. Resultados médicos inesperados deixam Joyce furiosa.",
"Jonasi é internado no hospital e Joyce assume o papel de esposa dedicada. Porém, mesmo enfrentando problemas de saúde, Jonasi continua obcecado por poder e controle.",
"Matipa e Joyce, ambas destruídas pelos abusos de Jonasi, encontram uma inesperada solidariedade. Com a ajuda de Magesh, Joyce começa finalmente a escolher a liberdade.",
"Depois de afastar Magesh e romper com praticamente toda a sua família, Jonasi fica completamente sozinho e recebe uma notícia devastadora sobre sua saúde.",
"Três anos se passam. A família Gomora está prosperando, mas Jonasi reaparece completamente transformado, como uma sombra do homem poderoso que já foi, obrigando a família a enfrentar as consequências do passado.",
"Frágil e debilitado, Jonasi passa seus dias sozinho enquanto sua saúde piora. Ao mesmo tempo, sua família luta contra sentimentos conflitantes de amor, mágoa e ódio pelo homem que destruiu tantas relações."
];
var doc=document,root=doc.documentElement,body=doc.body;
function pad2(n){return (n<10?'0':'')+n;}
var SHOTS=[];
for(var si=0;si<21;si++){SHOTS.push({idx:si+1,title:'Episódio '+(si+1),note:DESC[si]||'',tall:(si===19)});}
var stage=doc.getElementById('stage'),world=doc.getElementById('world'),orb=doc.getElementById('orb'),headline=doc.getElementById('headline');
var splash=doc.getElementById('splash'),bar=doc.getElementById('bar');
var intro=doc.getElementById('intro'),film=doc.getElementById('film'),skip=doc.getElementById('skip');
var gridEl=doc.getElementById('grid'),rows=gridEl.querySelector('.rows');
var menu=doc.getElementById('menu'),menuBtn=doc.getElementById('menuBtn'),gridBtn=doc.getElementById('gridBtn');
var lit=doc.getElementById('lit'),plate=lit.querySelector('.plate'),litImg=doc.getElementById('litImg'),litTitle=doc.getElementById('litTitle'),litWhere=doc.getElementById('litWhere'),litNote=doc.getElementById('litNote');
var dot=doc.getElementById('dot'),avatar=doc.getElementById('avatar');
var DEG=Math.PI/180,GA=Math.PI*(3-Math.sqrt(5));
var cards=[],cardImgs=[],gridImgs=[];
function build(){
  var N=SHOTS.length,i;
  for(i=0;i<N;i++){
    var s=SHOTS[i];
    var y=1-(i/(N-1))*2;
    var rad=Math.sqrt(Math.max(0,1-y*y));
    var th=i*GA;
    var x=Math.cos(th)*rad,z=Math.sin(th)*rad;
    var lat=Math.asin(y)*180/Math.PI,lon=Math.atan2(x,z)*180/Math.PI;
    var card=doc.createElement('div');
    card.className='card'+(s.tall?' tall':'');
    card.setAttribute('data-idx',i);
    var fig=doc.createElement('figure');
    var img=doc.createElement('img');
    img.alt=s.title;img.decoding='async';
    var ep=doc.createElement('span');ep.className='ep';ep.textContent='EP '+pad2(s.idx);
    fig.appendChild(img);fig.appendChild(ep);card.appendChild(fig);
    orb.appendChild(card);
    card._v={x:x,y:y,z:z,lat:lat,lon:lon};
    cards.push(card);cardImgs.push(img);
    var gf=doc.createElement('figure');
    gf.setAttribute('data-idx',i);
    var gi=doc.createElement('img');gi.alt=s.title;gi.loading='lazy';gi.decoding='async';
    var fc=doc.createElement('figcaption');
    var gep=doc.createElement('span');gep.className='ep';gep.textContent='EP '+pad2(s.idx);
    var gti=doc.createElement('span');gti.textContent=s.title;
    fc.appendChild(gep);fc.appendChild(gti);
    gf.appendChild(gi);gf.appendChild(fc);
    rows.appendChild(gf);
    gridImgs.push(gi);
  }
}
var R=0,cw=0,persp=1150,decodeMax=760;
function layout(){
  var w=window.innerWidth,h=window.innerHeight;
  var hr,wr,floor,scale,dp,dm;
  if(w<=380){hr=.38;wr=.48;floor=108;scale=.44;dp=620;dm=420;}
  else if(w<=640){hr=.42;wr=.52;floor=120;scale=.46;dp=760;dm=520;}
  else{hr=.46;wr=.58;floor=155;scale=.47;dp=(w<=900?920:1150);dm=(w<=900?640:760);}
  decodeMax=dm;
  R=Math.max(floor,Math.min(480,h*hr,w*wr));
  cw=Math.round(Math.max(72,R*scale));
  root.style.setProperty('--cw',cw+'px');
  root.style.setProperty('--persp',dp+'px');
  persp=dp;
  for(var i=0;i<cards.length;i++){
    var c=cards[i],v=c._v;
    c.style.transform='translate3d('+(v.x*R).toFixed(2)+'px,'+(-v.y*R).toFixed(2)+'px,'+(v.z*R).toFixed(2)+'px) rotateY('+v.lon.toFixed(2)+'deg) rotateX('+v.lat.toFixed(2)+'deg)';
  }
}
var spin=0,tilt=-4,camZ=0,dragX=0,dragY=0,velX=0,velY=0;
var PITCH=32,focused=-1,litOpen=false,dragging=false;
function frame(){
  if(!dragging&&!litOpen){
    dragX+=velX;dragY+=velY;
    velX*=0.94;velY*=0.94;
    if(Math.abs(velX)<0.002)velX=0;
    if(Math.abs(velY)<0.002)velY=0;
    var mn=-PITCH-tilt,mx=PITCH-tilt;
    if(dragY<mn){dragY=mn;velY=0;}
    if(dragY>mx){dragY=mx;velY=0;}
  }
  var sy=spin+dragX,sx=tilt+dragY;
  var maxS=Math.max(1,window.innerHeight*0.16);
  var scY=window.scrollY||root.scrollTop||0;
  if(scY>maxS){window.scrollTo(0,maxS);scY=maxS;}
  var p=Math.min(1,Math.max(0,scY/maxS));
  camZ+=(p*Math.min(64,R*0.12)-camZ)*0.075;
  world.style.transform='translateZ('+camZ.toFixed(2)+'px) rotateY('+sy.toFixed(3)+'deg) rotateX('+sx.toFixed(3)+'deg)';
  headline.style.transform='rotateX('+(-sx).toFixed(3)+'deg) rotateY('+(-sy).toFixed(3)+'deg) translateZ('+(R*0.62).toFixed(2)+'px)';
  headline.style.opacity=Math.max(0,1-p*0.55).toFixed(3);
  if(p>=0.35)body.classList.add('deep');else if(p<=0.2)body.classList.remove('deep');
  var cx=Math.cos(sx*DEG),sxn=Math.sin(sx*DEG),cy=Math.cos(sy*DEG),syn=Math.sin(sy*DEG);
  var near=persp*0.66,shade=1-Math.min(1,p*1.6);
  for(var i=0;i<cards.length;i++){
    var c=cards[i],v=c._v;
    var z1=v.y*sxn+v.z*cx;
    var z2=-v.x*syn+z1*cy;
    var base=0.14+0.86*Math.pow((z2+1)/2,0.85);
    var dim=shade*(1-base);
    var absZ=z2*R+camZ;
    var fade=1;
    if(absZ>near)fade=Math.max(0,1-(absZ-near)/190);
    if(focused>=0){dim=Math.min(1,dim+0.78);if(i===focused)fade=0;}
    var ds=dim.toFixed(3);
    if(c._ds!==ds){c.style.setProperty('--d',ds);c._ds=ds;}
    var fs=fade.toFixed(3);
    if(c._fs!==fs){c.style.opacity=fs;c._fs=fs;}
  }
  requestAnimationFrame(frame);
}
var downCard=null,downX=0,downY=0,lastX=0,lastY=0,dragId=null,touchCancelled=false;
function isCoarse(){return window.matchMedia('(pointer:coarse)').matches;}
function startDrag(e){
  dragging=true;
  lastX=e.clientX;lastY=e.clientY;
  try{stage.setPointerCapture(e.pointerId);}catch(err){}
}
stage.addEventListener('pointerdown',function(e){
  if(litOpen)return;
  downCard=e.target&&e.target.closest?e.target.closest('.card'):null;
  downX=e.clientX;downY=e.clientY;
  dragId=e.pointerId;touchCancelled=false;
  velX=0;velY=0;
  if(e.pointerType==='touch'){dragging=false;}
  else{startDrag(e);}
});
stage.addEventListener('pointermove',function(e){
  if(dragId!==e.pointerId||litOpen||touchCancelled)return;
  if(!dragging){
    if(e.pointerType==='touch'){
      var tx=e.clientX-downX,ty=e.clientY-downY;
      if(Math.abs(tx)>10||Math.abs(ty)>10){
        if(Math.abs(ty)>Math.abs(tx)*1.15){touchCancelled=true;dragId=null;return;}
        startDrag(e);
      }
    }
    if(!dragging)return;
  }
  var dx=e.clientX-lastX,dy=e.clientY-lastY;
  lastX=e.clientX;lastY=e.clientY;
  dragX+=dx*0.13;dragY+=dy*0.13;
  velX=dx*0.13;velY=dy*0.13;
  var mn=-PITCH-tilt,mx=PITCH-tilt;
  if(dragY<mn){dragY=mn;velY=0;}
  if(dragY>mx){dragY=mx;velY=0;}
});
function endDrag(e){
  if(dragId!==e.pointerId)return;
  var wasDragging=dragging;
  dragging=false;dragId=null;
  try{stage.releasePointerCapture(e.pointerId);}catch(err){}
  if(litOpen)return;
  var slop=isCoarse()?14:6;
  var dx=e.clientX-downX,dy=e.clientY-downY;
  if(!wasDragging||touchCancelled){if(!downCard)return;}
  if(Math.abs(dx)<=slop&&Math.abs(dy)<=slop&&downCard){openShot(+downCard.getAttribute('data-idx'),downCard);}
  downCard=null;
}
stage.addEventListener('pointerup',endDrag);
stage.addEventListener('pointercancel',function(e){
  if(dragId===e.pointerId){dragging=false;dragId=null;touchCancelled=true;downCard=null;}
});
var TOTAL=2,reported=0,born=performance.now(),splashDone=false;
function report(){
  reported++;
  bar.style.transform='scaleX('+Math.min(1,reported/TOTAL)+')';
  if(reported>=TOTAL)tryFinish();
}
function tryFinish(){
  if(splashDone)return;
  var el=performance.now()-born;
  if(el>=1150)finishSplash();else setTimeout(finishSplash,1150-el);
}
function finishSplash(){
  if(splashDone)return;
  splashDone=true;
  bar.style.transform='scaleX(1)';
  splash.classList.add('out');
  setTimeout(function(){if(splash.parentNode)splash.parentNode.removeChild(splash);},950);
  startFilm();
}
setTimeout(function(){finishSplash();},9000);
function downscale(im,max,cb){
  try{
    var s=Math.min(1,max/im.naturalWidth);
    var w=Math.max(1,Math.round(im.naturalWidth*s)),h=Math.max(1,Math.round(im.naturalHeight*s));
    var cv=doc.createElement('canvas');cv.width=w;cv.height=h;
    cv.getContext('2d').drawImage(im,0,0,w,h);
    cv.toBlob(function(b){cb(b?URL.createObjectURL(b):null);},'image/webp',0.88);
  }catch(e){cb(null);}
}
function setSrcEvery(u){
  var all=cardImgs.concat(gridImgs);
  for(var i=0;i<all.length;i++){
    (function(im){
      im.onload=function(){im.classList.add('in');};
      im.src=u;
      if(im.complete&&im.naturalWidth)im.classList.add('in');
    })(all[i]);
  }
  avatar.src=u;
}
function loadStills(){
  var im=new Image(),done=false;
  var rep=function(){if(!done){done=true;report();}};
  im.onload=function(){
    setSrcEvery(CAPA);
    rep();
    if(im.naturalWidth>decodeMax)downscale(im,decodeMax,function(u){if(u)setSrcEvery(u);});
    if(im.naturalWidth>160)downscale(im,160,function(u){if(u)avatar.src=u;});
  };
  im.onerror=function(){setSrcEvery(CAPA);rep();};
  im.src=CAPA;
}
var filmStart=0,revealed=false,revealScheduled=false,seeked=false,filmReported=false;
function filmReport(){if(!filmReported){filmReported=true;report();}}
function reveal(){
  if(revealed)return;
  revealed=true;
  intro.classList.add('closing');
  body.classList.remove('locked');
  root.style.overflow='';
  layout();
  requestAnimationFrame(function(){layout();});
  setTimeout(function(){
    layout();
    body.classList.add('revealed');
    intro.classList.add('gone');
    setTimeout(function(){if(intro.parentNode)intro.parentNode.removeChild(intro);},700);
  },1000);
}
function revealSoon(ms){
  if(revealed)return;
  if(splashDone){setTimeout(reveal,ms);return;}
  var t=setInterval(function(){if(splashDone){clearInterval(t);setTimeout(reveal,ms);}},120);
}
function armManualPlay(){
  if(revealed)return;
  var go=function(){var pr=null;try{pr=film.play();}catch(e){}if(pr&&pr.catch)pr.catch(function(){});};
  window.addEventListener('pointerdown',go,{once:true,passive:true});
  window.addEventListener('keydown',go,{once:true,passive:true});
  window.addEventListener('touchstart',go,{once:true,passive:true});
}
function scheduleFromFilm(){
  if(revealed||revealScheduled||!filmStart)return;
  if(film.paused)return;
  if(!isFinite(film.duration)||film.duration<=0)return;
  if(!seeked&&film.currentTime>0.5)return;
  revealScheduled=true;
  var rem=(film.duration-film.currentTime-0.45)/2;
  setTimeout(function(){if(!revealed)reveal();},Math.max(300,rem*1000));
}
function startFilm(){
  filmStart=performance.now();
  try{film.muted=true;film.defaultMuted=true;film.playsInline=true;film.webkitPlaysInline=true;}catch(e){}
  film.setAttribute('muted','');film.setAttribute('playsinline','');
  if(film.currentTime>0.05){try{film.currentTime=0;}catch(e){}}else{seeked=true;}
  try{film.playbackRate=2;}catch(e){}
  var pr=null;try{pr=film.play();}catch(e){}
  if(pr&&pr.catch)pr.catch(function(){armManualPlay();});
  scheduleFromFilm();
  setTimeout(function(){if(!revealed&&film.paused)reveal();},2600);
  setTimeout(function(){if(!revealed)reveal();},14000);
}
film.addEventListener('seeked',function(){seeked=true;scheduleFromFilm();});
film.addEventListener('timeupdate',scheduleFromFilm);
film.addEventListener('loadedmetadata',scheduleFromFilm);
film.addEventListener('playing',function(){try{film.playbackRate=2;}catch(e){}scheduleFromFilm();});
film.addEventListener('ended',function(){reveal();});
film.addEventListener('error',function(){filmReport();intro.classList.add('novideo');revealSoon(1300);});
if(film.readyState>=2)filmReport();
else{
  film.addEventListener('loadeddata',filmReport);
  film.addEventListener('canplaythrough',filmReport);
}
skip.addEventListener('click',function(){reveal();});
var srcEl=null;
function openShot(i,from){
  if(litOpen)return;
  litOpen=true;focused=i;srcEl=from;
  var s=SHOTS[i];
  litTitle.textContent=s.title;
  litWhere.textContent='1ª Temporada · 2026';
  litNote.textContent=s.note;
  litImg.alt=s.title;
  litImg.src=(cardImgs[i]&&cardImgs[i].src)||CAPA;
  body.classList.add('lit');
  body.classList.add('locked');
  requestAnimationFrame(function(){flipOpen(from);});
}
function flipOpen(from){
  var pr=plate.getBoundingClientRect(),cr=from.getBoundingClientRect();
  if(!cr.width||!pr.width)return;
  var dx=cr.left+cr.width/2-(pr.left+pr.width/2);
  var dy=cr.top+cr.height/2-(pr.top+pr.height/2);
  var sc=Math.max(0.04,cr.width/pr.width);
  plate.style.transition='none';
  plate.style.transform='translate('+dx+'px,'+dy+'px) scale('+sc+')';
  plate.style.opacity='0';
  void plate.offsetWidth;
  plate.style.transition='';
  plate.style.transform='';
  plate.style.opacity='';
}
function closeLit(){
  if(!litOpen)return;
  focused=-1;litOpen=false;
  body.classList.remove('lit');
  body.classList.remove('locked');
  if(srcEl&&srcEl.isConnected){
    var pr=plate.getBoundingClientRect(),cr=srcEl.getBoundingClientRect();
    if(cr.width&&pr.width){
      var dx=cr.left+cr.width/2-(pr.left+pr.width/2);
      var dy=cr.top+cr.height/2-(pr.top+pr.height/2);
      var sc=Math.max(0.04,cr.width/pr.width);
      plate.style.transform='translate('+dx+'px,'+dy+'px) scale('+sc+')';
      plate.style.opacity='0';
      setTimeout(function(){
        plate.style.transition='none';
        plate.style.transform='';
        plate.style.opacity='';
        void plate.offsetWidth;
        plate.style.transition='';
      },640);
    }
  }
  srcEl=null;
}
lit.addEventListener('click',function(e){
  if(e.target&&e.target.closest&&e.target.closest('[data-close]'))closeLit();
});
function toggleMenu(open){
  var isOpen=(open===undefined)?!menu.classList.contains('open'):open;
  menu.classList.toggle('open',isOpen);
  body.classList.toggle('menu-open',isOpen);
  menuBtn.setAttribute('aria-expanded',isOpen?'true':'false');
  menuBtn.setAttribute('aria-label',isOpen?'Fechar menu':'Abrir menu');
}
menuBtn.addEventListener('click',function(){toggleMenu();});
menu.addEventListener('click',function(e){
  var a=e.target&&e.target.closest?e.target.closest('a'):null;
  if(!a)return;
  e.preventDefault();
  toggleMenu(false);
  if(a.hasAttribute('data-grid'))setGrid(true);
});
function setGrid(on){body.classList.toggle('gridview',on);}
gridBtn.addEventListener('click',function(){setGrid(!body.classList.contains('gridview'));});
rows.addEventListener('click',function(e){
  var f=e.target&&e.target.closest?e.target.closest('figure'):null;
  if(f)openShot(+f.getAttribute('data-idx'),f);
});
window.addEventListener('keydown',function(e){
  if(e.key==='Escape'||e.keyCode===27){
    if(litOpen)closeLit();
    else if(menu.classList.contains('open'))toggleMenu(false);
    else if(body.classList.contains('gridview'))setGrid(false);
  }
});
var mx=window.innerWidth/2,my=window.innerHeight/2,dxx=mx,dyy=my;
window.addEventListener('pointermove',function(e){
  if(e.pointerType!=='mouse')return;
  mx=e.clientX;my=e.clientY;
  if(dot&&e.target&&e.target.closest)dot.classList.toggle('wide',!!e.target.closest('.card,a,button,#grid figure'));
});
(function dotLoop(){
  dxx+=(mx-dxx)*0.2;dyy+=(my-dyy)*0.2;
  if(dot)dot.style.transform='translate3d('+dxx+'px,'+dyy+'px,0)';
  requestAnimationFrame(dotLoop);
})();
var lastW=window.innerWidth,lastH=window.innerHeight;
window.addEventListener('resize',function(){
  if(Math.abs(window.innerWidth-lastW)<20&&Math.abs(window.innerHeight-lastH)<20)return;
  lastW=window.innerWidth;lastH=window.innerHeight;
  layout();
});
window.addEventListener('orientationchange',function(){
  setTimeout(function(){lastW=window.innerWidth;lastH=window.innerHeight;layout();},220);
});
if(window.visualViewport){
  window.visualViewport.addEventListener('resize',layout);
  window.visualViewport.addEventListener('scroll',layout);
}
root.style.overflow='hidden';
window.scrollTo(0,0);
build();
layout();
frame();
avatar.src=CAPA;
loadStills();
})();
</script>
</body>
</html>
